# Installed by Peeqo's install.sh as /etc/asound.conf. The board's sound chip (a WM8960: the speaker, and the
# microphones) is the default for playing and recording. It runs at one rate (48 kHz) both ways, shared through dmix
# (playing) and dsnoop (recording), so the microphone (16 kHz, always on for the wake word) and sounds (any rate) can
# run at the same time; plug converts.
pcm.!default {
  type asym
  playback.pcm "peeqo_play"
  capture.pcm "peeqo_record"
}
pcm.peeqo_play {
  type plug
  slave.pcm "peeqo_dmix"
}
pcm.peeqo_record {
  type plug
  slave.pcm "peeqo_dsnoop"
}
pcm.peeqo_dmix {
  type dmix
  ipc_key 4241
  ipc_perm 0666
  slave {
    pcm "hw:wm8960soundcard"
    rate 48000
    channels 2
  }
}
pcm.peeqo_dsnoop {
  type dsnoop
  ipc_key 4242
  ipc_perm 0666
  slave {
    pcm "hw:wm8960soundcard"
    rate 48000
    channels 2
  }
}
ctl.!default {
  type hw
  card wm8960soundcard
}
